name: Build for macOS (Apple Silicon)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARCHIVE_NAME: winticator-macos.zip

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install Fyne Dependencies
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest

      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@v1.7.1

      - name: Set build number
        run: sed -i '' 's/^Build = .*/Build = ${{ github.run_number }}/' src/FyneApp.toml

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/^Version = .*/Version = \"$VERSION\"/" src/FyneApp.toml

      - name: Build
        run: fyne package -os darwin -src=./src -release

      - name: Archive
        run: zip --symlinks -r ${{ env.ARCHIVE_NAME }} Winticator.app/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} ${{ env.ARCHIVE_NAME }}
