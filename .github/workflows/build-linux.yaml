name: Build for Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARCHIVE_NAME: winticator-linux.tar.xz

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-fyne-linux-deps

      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@v1.7.1

      - name: Set build number
        run: sed -i 's/^Build = .*/Build = ${{ github.run_number }}/' src/FyneApp.toml

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^Version = .*/Version = \"$VERSION\"/" src/FyneApp.toml

      - name: Build
        run: fyne package -os linux -src=./src -release

      - name: Archive
        run: mv Winticator.tar.xz ${{ env.ARCHIVE_NAME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} ${{ env.ARCHIVE_NAME }}
